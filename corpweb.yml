---
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  InstanceType:
    Description: Server instance type
    Type: String
    AllowedValues:
    - t2.micro
    - t2.small
    ConstraintDescription: Must be a valid EC2 type.
  KeyPair:
    Description: Server key-pair name for EC2 instances
    Type: AWS::EC2::KeyPair::KeyName
  YourIp:
    Description: Your public IP address in CIDR notation.
    Type: String
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
    ConstraintDescription: Must be a valid CIDR block in the form of X.X.X.X (e.g., 192.168.1.1)
Resources:
  EngineeringVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/18
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EngineeringVpc
      CidrBlock: 10.0.0.0/24
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EngineeringVpc
      CidrBlock: 10.0.1.0/24  
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties: {}
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref EngineeringVpc
  S3Role:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - Effect: "Allow"
            Principal: 
              Service: 
                - "ec2.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      Path: "/"
      RolePolicies: 
        - PolicyName: "S3AccessPolicy"
          PolicyDocument: 
            Version: "2012-10-17"
            Statement: 
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource: "*"
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles: !Ref "S3Role"
  web1:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: EC2InstanceProfile
      ImageId: ami-0d27e0fb3bac4d724
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds: 
        - WebserversSG
      SubnetId: PublicSubnet1
      Tags:
      - Key: Name
        Value: web1
      UserData:
        Fn::Base64: !Sub |
           #!/bin/bash
           dnf update -y
           dnf install -y git httpd php
           service httpd start
           chkconfig httpd on
           aws s3 cp s3://seis665-public/index.php /var/www/html/ 
    web2:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: EC2InstanceProfile
      ImageId: ami-0d27e0fb3bac4d724
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds: 
        - WebserversSG
      SubnetId: PublicSubnet2
      Tags:
      - Key: Name
        Value: web2
      UserData:
        Fn::Base64: !Sub |
           #!/bin/bash
           dnf update -y
           dnf install -y git httpd php
           service httpd start
           chkconfig httpd on
           aws s3 cp s3://seis665-public/index.php /var/www/html/ 
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: classVpc
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      RouteTableId:
        Ref: PublicRouteTable
      GatewayId:
        Ref: InternetGateway
    DependsOn:
    - InternetGateway
  PublicSubnet1RTassoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet1
  WebserversSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EngineeringVpc
      GroupDescription: Security group rules for webserver hosts.
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref YourIp  
  EngineeringLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Type: application
  EngineeringWebservers:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: tcp
      Port: 80
Outputs:
  WebUrl:
    Value:
      Fn::Join:
      - ''
      - - http://
        - Fn::GetAtt:
          - EngineeringLB
          - DNSName
    Description: Load balancer DNS name
